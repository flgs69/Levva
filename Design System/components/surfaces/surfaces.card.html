<!-- @dsCard group="Componentes" viewport="700x300" name="Card, Tabs, Dialog" subtitle="Surfaces: flat-shadow card, tabs, modal" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="position:relative;padding:20px;background:var(--surface-page);font-family:var(--font-body);min-height:280px"></div>
<script type="text/babel">
const { Card, Tabs, Dialog, Button } = window.LiveHubShoppingDesignSystem_8f0aee;
function Demo(){
  const [tab,setTab]=React.useState('pending');
  const [open,setOpen]=React.useState(false);
  return <div style={{display:'flex',flexDirection:'column',gap:16,position:'relative'}}>
    <Tabs items={[{label:'Pendentes',value:'pending'},{label:'Aprovados',value:'approved'},{label:'Rejeitados',value:'rejected'}]} active={tab} onChange={setTab}/>
    <div style={{display:'flex',gap:12}}>
      <Card style={{flex:1}}>
        <div style={{fontFamily:'var(--font-display)',fontWeight:700,fontSize:'var(--text-lg)'}}>1,204</div>
        <div style={{color:'var(--text-secondary)',fontSize:'var(--text-sm)'}}>vídeos este mês</div>
      </Card>
      <Button onClick={()=>setOpen(true)}>Abrir modal</Button>
    </div>
    <Dialog open={open} title="Aprovar envio?" onClose={()=>setOpen(false)} footer={<><Button variant="ghost" onClick={()=>setOpen(false)}>Cancelar</Button><Button onClick={()=>setOpen(false)}>Aprovar</Button></>}>
      Isso paga R$ 5 ao cliente e publica o vídeo na página da loja.
    </Dialog>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
