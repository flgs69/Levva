<!-- @dsCard group="Marca" viewport="700x460" name="Movimento" subtitle="Rápido, 120–200ms ease-out, sem bounce — 4 exemplos" -->
<link rel="stylesheet" href="../styles.css">
<style>
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.demo{animation:lift 1.6s var(--ease-snap) infinite}
@keyframes toggle-slide{0%,20%{transform:translateX(0)}50%,70%{transform:translateX(18px)}100%{transform:translateX(0)}}
.toggle-knob{animation:toggle-slide 2s var(--ease-snap) infinite}
@keyframes toggle-bg{0%,20%{background:var(--paper-100)}50%,70%{background:var(--brand-coral)}100%{background:var(--paper-100)}}
.toggle-track{animation:toggle-bg 2s var(--ease-snap) infinite}
@keyframes card-lift{0%,100%{transform:translateY(0);box-shadow:var(--shadow-flat-sm)}50%{transform:translateY(-4px);box-shadow:var(--shadow-flat-md)}}
.card-demo{animation:card-lift 1.8s var(--ease-snap) infinite}
@keyframes modal-in{0%,10%{opacity:0;transform:scale(0.92)}30%,80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(0.92)}}
.modal-demo{animation:modal-in 2.4s var(--ease-snap) infinite}
</style>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;background:var(--surface-page);font-family:var(--font-body)">

<div style="height:100px;background:var(--surface-card);border:1px solid var(--line-100);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px">
<div class="demo" style="padding:10px 18px;background:var(--brand-coral);color:#fff;border-radius:999px;font-weight:700;font-size:12px">hover, translateY -6px</div>
<div style="font-size:10px;color:var(--ink-500)">120–200ms ease-snap</div>
</div>

<div style="height:100px;background:var(--surface-card);border:1px solid var(--line-100);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px">
<div class="toggle-track" style="width:44px;height:26px;border-radius:999px;border:2px solid var(--border-strong);position:relative"><div class="toggle-knob" style="position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink-900)"></div></div>
<div style="font-size:10px;color:var(--ink-500)">switch, desliza + muda de cor</div>
</div>

<div style="height:100px;background:var(--surface-card);border:1px solid var(--line-100);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px">
<div class="card-demo" style="width:70px;height:36px;background:var(--surface-card);border:2px solid var(--border-strong);border-radius:8px"></div>
<div style="font-size:10px;color:var(--ink-500)">card, sobe + sombra cresce</div>
</div>

<div style="height:100px;background:var(--ink-900);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px">
<div class="modal-demo" style="width:70px;height:40px;background:var(--paper-0);border-radius:8px"></div>
<div style="font-size:10px;color:var(--paper-100)">modal, scale 0.92 → 1 + fade</div>
</div>

</div>
