<link rel="stylesheet" href="../styles.css">
<div style="padding:20px;background:var(--surface-page);font-family:var(--font-display);font-weight:800;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">
<div style="display:flex;align-items:center;gap:10px"><img src="../assets/brand/logomark-coral.svg" style="width:44px;height:44px"><span style="font-size:56px;color:var(--ink-900);letter-spacing:-0.02em">MONI</span></div>
<div style="display:flex;align-items:center;gap:7px"><img src="../assets/brand/logomark-coral.svg" style="width:26px;height:26px"><span style="font-size:32px;color:var(--brand-coral);letter-spacing:-0.02em">MONI</span></div>
<div style="display:flex;align-items:center;gap:5px"><img src="../assets/brand/logomark-ink.svg" style="width:17px;height:17px"><span style="font-size:20px;color:var(--ink-500);letter-spacing:-0.01em">MONI</span></div>
</div>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<div style="display:flex;align-items:center;gap:8px;background:var(--ink-900);padding:14px 20px;border-radius:10px;color:var(--paper-0);font-size:26px;letter-spacing:-0.02em"><img src="../assets/brand/logomark-paper.svg" style="width:24px;height:24px">MONI</div>
<div style="display:flex;align-items:center;gap:8px;background:var(--brand-coral);padding:14px 20px;border-radius:10px;color:var(--paper-0);font-size:26px;letter-spacing:-0.02em"><img src="../assets/brand/logomark-paper.svg" style="width:24px;height:24px">MONI</div>

<div style="display:flex;align-items:center;gap:8px;background:var(--accent-teal);padding:14px 20px;border-radius:10px;color:var(--paper-0);font-size:26px;letter-spacing:-0.02em"><img src="../assets/brand/logomark-paper.svg" style="width:24px;height:24px">MONI</div>
<div style="display:flex;align-items:center;gap:8px;background:var(--accent-gold);padding:14px 20px;border-radius:10px;color:var(--ink-900);font-size:26px;letter-spacing:-0.02em"><img src="../assets/brand/logomark-ink.svg" style="width:24px;height:24px">MONI</div>
<div style="display:flex;align-items:center;gap:8px;background:var(--info-600);padding:14px 20px;border-radius:10px;color:var(--paper-0);font-size:26px;letter-spacing:-0.02em"><img src="../assets/brand/logomark-paper.svg" style="width:24px;height:24px">MONI</div>
</div>
</div>
