<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Slide de abertura" description="Slide de título 1920x1080 para apresentações da marca" -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="width:1920px;height:1080px;background:var(--ink-900);position:relative;box-sizing:border-box;overflow:hidden;font-family:var(--font-body);display:flex;flex-direction:column;justify-content:space-between;padding:80px">
<div style="position:absolute;inset:0;background-image:url(../../assets/brand/pattern-organic-dark.svg);background-size:300px;opacity:0.4"></div>
<div style="position:relative;display:flex;align-items:center;gap:16px">
<img src="../../assets/brand/logomark-paper.svg" style="width:44px;height:44px">
<span style="font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--paper-0)">MONI</span>
</div>
<div style="position:relative">
<div style="font-family:var(--font-display);font-weight:800;font-size:88px;line-height:1.05;letter-spacing:-0.02em;color:var(--paper-0);max-width:1400px">Transformando compradores em criadores.</div>
<div style="font-size:26px;color:var(--paper-100);opacity:0.85;margin-top:24px">Resultados da campanha — Shopping Riverside</div>
</div>
<div style="position:relative;color:var(--paper-300,var(--ink-300));font-size:16px">MONI Shopping · Agosto 2026</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:236}}"></script>
</body>
</html>
