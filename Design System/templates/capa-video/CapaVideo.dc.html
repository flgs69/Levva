<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Capa de vídeo" description="Thumbnail/capa 16:9 (1920x1080) para vídeos de campanha" -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="width:1920px;height:1080px;background:var(--paper-0);position:relative;overflow:hidden;font-family:var(--font-body);display:flex">
<div style="flex:1;background:var(--ink-900);display:flex;align-items:center;justify-content:center;color:var(--paper-300,var(--ink-300));font-size:28px">imagem/still do vídeo</div>
<div style="width:640px;background:var(--brand-coral);position:relative;box-sizing:border-box;padding:64px;display:flex;flex-direction:column;justify-content:space-between">
<div style="position:absolute;inset:0;background-image:url(../../assets/brand/pattern-geometric-paper.svg);background-size:140px;opacity:0.25"></div>
<div style="position:relative;display:flex;align-items:center;gap:12px">
<img src="../../assets/brand/logomark-paper.svg" style="width:36px;height:36px">
<span style="font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--paper-0)">MONI</span>
</div>
<div style="position:relative;font-family:var(--font-display);font-weight:800;font-size:56px;line-height:1.05;color:var(--paper-0)">Desafio da Compra do Fim de Semana</div>
<div style="position:relative;display:inline-flex;align-self:flex-start;background:var(--ink-900);color:var(--paper-0);padding:16px 28px;border-radius:999px;font-weight:700;font-size:22px">Assista o vídeo</div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:236}}"></script>
</body>
</html>
