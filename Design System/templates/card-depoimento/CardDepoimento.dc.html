<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Card de depoimento" description="Card de depoimento de cliente para telas de produto ou site" -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="width:420px;background:var(--surface-card);border:2px solid var(--border-strong);border-radius:16px;box-shadow:var(--shadow-flat-md);padding:24px;box-sizing:border-box;font-family:var(--font-body);display:flex;flex-direction:column;gap:14px">
<div style="width:100%;aspect-ratio:16/10;background:var(--ink-900);border-radius:10px;position:relative;display:flex;align-items:center;justify-content:center">
<svg width="40" height="40" viewBox="0 0 24 24" fill="var(--paper-0)"><path d="M8 5v14l11-7z"/></svg>
</div>
<div style="display:flex;align-items:center;gap:10px">
<div style="width:36px;height:36px;border-radius:50%;background:var(--paper-200);flex-shrink:0"></div>
<div>
<div style="font-weight:700;font-size:14px;color:var(--text-primary)">Priya K.</div>
<div style="font-size:12px;color:var(--text-secondary)">comprou na Sephora — Shopping Riverside</div>
</div>
</div>
<div style="font-size:14px;color:var(--text-primary)">"Testei o novo fixador o dia todo no shopping e realmente segurou a maquiagem — vale muito a pena."</div>
<div style="display:inline-flex;align-self:flex-start;background:var(--success-100);color:var(--success-600);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em">Recompensa: R$ 8</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:420}}"></script>
</body>
</html>
