<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="CTA banner" description="Banner de chamada para ação reutilizável em telas de produto" -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="width:900px;background:var(--ink-900);border-radius:20px;padding:36px 44px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:24px;font-family:var(--font-body);position:relative;overflow:hidden">
<div style="position:absolute;inset:0;background-image:url(../../assets/brand/pattern-geometric-paper.svg);background-size:120px;opacity:0.12"></div>
<div style="position:relative">
<div style="font-family:var(--font-display);font-weight:800;font-size:30px;color:var(--paper-0)">Grave sua compra, ganhe até R$ 10.</div>
<div style="font-size:15px;color:var(--paper-100);opacity:0.85;margin-top:6px">Leva 30 segundos. O pagamento cai em até 24 horas.</div>
</div>
<div style="position:relative;background:var(--brand-coral);color:var(--paper-0);padding:16px 28px;border-radius:999px;font-weight:700;font-size:16px;white-space:nowrap">Começar agora</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:170}}"></script>
</body>
</html>
