<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Post social" description="Post quadrado 1080x1080 com pattern geométrico e CTA" -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="width:1080px;height:1080px;background:var(--brand-coral);position:relative;overflow:hidden;font-family:var(--font-body)">
<div style="position:absolute;inset:0;background-image:url(../../assets/brand/pattern-geometric-paper.svg);background-size:180px;opacity:0.35"></div>
<div style="position:relative;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;padding:64px">
<div style="display:flex;align-items:center;gap:16px">
<img src="../../assets/brand/logomark-paper.svg" style="width:48px;height:48px">
<span style="font-family:var(--font-display);font-weight:800;font-size:32px;color:var(--paper-0)">MONI</span>
</div>
<div style="max-width:820px">
<div style="font-family:var(--font-display);font-weight:800;font-size:96px;line-height:1.02;letter-spacing:-0.02em;color:var(--paper-0)">Grave, poste, ganhe.</div>
<div style="font-size:28px;color:var(--paper-0);opacity:0.9;margin-top:24px">Sua compra vira conteúdo. Seu conteúdo vira recompensa.</div>
</div>
<div style="display:inline-flex;align-self:flex-start;background:var(--ink-900);color:var(--paper-0);padding:20px 36px;border-radius:999px;font-weight:700;font-size:26px">Participe no app MONI</div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:400}}"></script>
</body>
</html>
