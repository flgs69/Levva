<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Sinalização de estúdio" description="Pôster A3 para o estúdio de gravação no shopping" -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="width:1191px;height:1684px;background:var(--paper-0);position:relative;overflow:hidden;font-family:var(--font-body);display:flex;flex-direction:column">
<div style="background:var(--brand-coral);padding:64px 56px;box-sizing:border-box;position:relative;overflow:hidden">
<div style="position:absolute;inset:0;background-image:url(../../assets/brand/pattern-geometric-paper.svg);background-size:150px;opacity:0.3"></div>
<div style="position:relative;display:flex;align-items:center;gap:16px;margin-bottom:32px">
<img src="../../assets/brand/logomark-paper.svg" style="width:44px;height:44px">
<span style="font-family:var(--font-display);font-weight:800;font-size:30px;color:var(--paper-0)">MONI</span>
</div>
<div style="position:relative;font-family:var(--font-display);font-weight:800;font-size:72px;line-height:1.05;color:var(--paper-0)">Grave seu vídeo aqui.</div>
</div>
<div style="flex:1;padding:56px;box-sizing:border-box;display:flex;flex-direction:column;gap:36px">
<div style="display:flex;gap:24px;align-items:flex-start">
<div style="width:56px;height:56px;border-radius:50%;background:var(--ink-900);color:var(--paper-0);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:26px;flex-shrink:0">1</div>
<div style="font-size:26px;color:var(--text-primary);padding-top:10px">Mostre sua identificação de compra na entrada do estúdio.</div>
</div>
<div style="display:flex;gap:24px;align-items:flex-start">
<div style="width:56px;height:56px;border-radius:50%;background:var(--ink-900);color:var(--paper-0);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:26px;flex-shrink:0">2</div>
<div style="font-size:26px;color:var(--text-primary);padding-top:10px">Grave um vídeo de até 30 segundos sobre o que comprou.</div>
</div>
<div style="display:flex;gap:24px;align-items:flex-start">
<div style="width:56px;height:56px;border-radius:50%;background:var(--ink-900);color:var(--paper-0);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:26px;flex-shrink:0">3</div>
<div style="font-size:26px;color:var(--text-primary);padding-top:10px">Envie no app MONI e receba sua recompensa em até 24 horas.</div>
</div>
<div style="margin-top:auto;background:var(--paper-100);border:2px solid var(--border-strong);border-radius:16px;padding:28px;text-align:center;font-family:var(--font-display);font-weight:800;font-size:34px;color:var(--ink-900)">Baixe o app MONI e comece agora</div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:396}}"></script>
</body>
</html>
