<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Story" description="Story vertical 1080x1920 com pattern orgânico" -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="width:1080px;height:1920px;background:var(--ink-900);position:relative;overflow:hidden;font-family:var(--font-body)">
<div style="position:absolute;inset:0;background-image:url(../../assets/brand/pattern-organic-dark.svg);background-size:260px;opacity:0.5"></div>
<div style="position:relative;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;padding:72px 56px">
<div style="display:flex;align-items:center;gap:14px">
<img src="../../assets/brand/logomark-paper.svg" style="width:40px;height:40px">
<span style="font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--paper-0)">MONI</span>
</div>
<div>
<div style="font-family:var(--font-display);font-weight:800;font-size:84px;line-height:1.05;letter-spacing:-0.02em;color:var(--paper-0)">Tem 30 segundos?</div>
<div style="font-size:32px;color:var(--paper-100);opacity:0.9;margin-top:20px">Mostra sua compra e ganha até R$ 10 de volta.</div>
</div>
<div style="display:flex;flex-direction:column;gap:20px">
<div style="background:var(--brand-coral);color:var(--paper-0);text-align:center;padding:26px;border-radius:999px;font-weight:700;font-size:30px">Arraste pra cima</div>
</div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:390}}"></script>
</body>
</html>
