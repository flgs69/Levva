<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%}#root{height:100vh;display:flex}</style>
<div id="root"></div>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="TopBar.jsx"></script>
<script type="text/babel" src="CampaignsScreen.jsx"></script>
<script type="text/babel" src="ReviewScreen.jsx"></script>
<script type="text/babel" src="AnalyticsScreen.jsx"></script>
<script type="text/babel">
function App(){
  const [nav,setNav]=React.useState('campaigns');
  const titles={campaigns:['Campanhas','Todo incentivo rodando no seu shopping'],review:['Fila de revisão','Aprove os vídeos antes de irem ao ar'],analytics:['Análises','Como o conteúdo dos criadores está impactando o resultado'],settings:['Configurações','Pagamentos, marca e acesso da equipe']};
  return <div style={{display:'flex',width:'100%',fontFamily:'var(--font-body)',background:'var(--surface-page)'}}>
    <Sidebar active={nav} onNav={setNav}/>
    <div style={{flex:1,overflow:'auto'}}>
      <TopBar title={titles[nav][0]} subtitle={titles[nav][1]}/>
      {nav==='campaigns' && <CampaignsScreen/>}
      {nav==='review' && <ReviewScreen/>}
      {nav==='analytics' && <AnalyticsScreen/>}
      {nav==='settings' && <div style={{padding:'0 32px',color:'var(--text-secondary)'}}>Não construído neste kit, replique os padrões de Campanhas/Revisão acima.</div>}
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
